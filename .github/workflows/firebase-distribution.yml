name: Build & Deploy to Firebase App Distribution

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas de la versión (opcional)'
        required: false
        default: ''

jobs:
  build-and-distribute:
    name: Build APK & Distribute
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código fuente ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Caches (antes de cualquier instalación) ──────────────────────────
      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.3.13750724
          key: ndk-27.3.13750724

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: .github/scripts/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.github/scripts/package*.json') }}
          restore-keys: node-${{ runner.os }}-

      # ── 3. Java 17 (requerido por Gradle 8+) ───────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 4. Flutter ──────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ── 5. Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 6. Restaurar archivos sensibles desde Secrets ──────────────────────
      - name: Restore secrets
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > lib/firebase_options.dart
          echo "${{ secrets.ENV_FILE }}"              | base64 --decode > .env

      # ── 7. Leer versión desde pubspec.yaml ──────────────────────────────────
      # Para cambiar versión: edita "version: X.Y.Z+N" en pubspec.yaml
      # El build number se sobreescribe con github.run_number (auto-incremental)
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "full=$VERSION_NAME+${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME (build ${{ github.run_number }})"

      # ── 8. Dependencias ──────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      - name: Install Node dependencies
        run: npm install firebase-admin --save
        working-directory: .github/scripts

      # ── 9. Build APKs por arquitectura ───────────────────────────────────────
      # arm64-v8a  → dispositivos modernos (95%+ de usuarios reales)
      # armeabi-v7a → dispositivos antiguos de 32-bit
      - name: Build APKs (split by ABI)
        run: |
          flutter build apk \
            --split-per-abi \
            --release \
            --build-number=${{ github.run_number }} \
            --build-name=${{ steps.version.outputs.name }}

      # ── 9. Subir APKs a Firebase Storage ────────────────────────────────────
      - name: Upload APKs to Firebase Storage
        id: upload_storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/upload_apks.js

      # ── 10. Actualizar versión en Firestore (activa el update in-app) ────────
      - name: Update version in Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_URL:         ${{ steps.upload_storage.outputs.arm64_url }}
          APK_URL_ARM64:   ${{ steps.upload_storage.outputs.arm64_url }}
          APK_URL_ARMEABI: ${{ steps.upload_storage.outputs.armeabi_url }}
          VERSION_CODE:    ${{ github.run_number }}
          VERSION_NAME:    ${{ steps.version.outputs.full }}
          RELEASE_NOTES: |
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}
        run: node .github/scripts/update_version.js

      # ── 11. Firebase App Distribution — arm64-v8a (dispositivos modernos) ───
      - name: Upload arm64-v8a to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: tester-tekoplay
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: |
            Build #${{ github.run_number }} — v${{ steps.version.outputs.full }} [arm64-v8a]
            Dispositivos: Samsung, Pixel, Xiaomi y cualquier Android moderno
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}

      # ── 12. Firebase App Distribution — armeabi-v7a (dispositivos antiguos) ─
      - name: Upload armeabi-v7a to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: tester-tekoplay
          file: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          releaseNotes: |
            Build #${{ github.run_number }} — v${{ steps.version.outputs.full }} [armeabi-v7a]
            Dispositivos: Android antiguos de 32-bit
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}

      # ── 13. Artefactos del workflow (descarga manual desde Actions) ──────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tekoplay-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 15
