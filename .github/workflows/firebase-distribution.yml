name: Build & Deploy to Firebase App Distribution

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas de la versión (opcional)'
        required: false
        default: ''

jobs:
  build-and-distribute:
    name: Build APK & Distribute
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código fuente ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (requerido por Gradle 8+) ───────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ──────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ── 4. Node.js (para el script de Firestore) ────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 5. Restaurar archivos sensibles desde Secrets ──────────────────────
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Restore firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > lib/firebase_options.dart

      - name: Restore .env
        run: echo "${{ secrets.ENV_FILE }}" | base64 --decode > .env

      # ── 6. Dependencias Flutter ─────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Build APK release ────────────────────────────────────────────────
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.0

      # ── 8. Subir APK a Firebase Storage (URL pública de descarga) ───────────
      - name: Upload APK to Firebase Storage
        id: upload_storage
        run: |
          npm install -g firebase-tools

          # Exportar credenciales de la cuenta de servicio
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json

          # Subir APK a Firebase Storage
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          STORAGE_PATH="app-updates/android/app-release.apk"
          PROJECT_ID="tekoplay-38f7b"

          firebase storage:cp \
            "$APK_PATH" \
            "gs://${PROJECT_ID}.firebasestorage.app/${STORAGE_PATH}" \
            --project "$PROJECT_ID"

          # Generar URL pública de descarga
          APK_URL="https://firebasestorage.googleapis.com/v0/b/${PROJECT_ID}.firebasestorage.app/o/$(echo $STORAGE_PATH | sed 's/\//%2F/g')?alt=media"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "✅ APK subido a Storage: $APK_URL"

      # ── 9. Actualizar version en Firestore (activa el update in-app) ─────────
      - name: Update version in Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_URL: ${{ steps.upload_storage.outputs.apk_url }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.0+${{ github.run_number }}"
          RELEASE_NOTES: |
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}
        run: |
          cd .github/scripts
          npm install firebase-admin --save
          node update_version.js

      # ── 10. Distribuir por email via Firebase App Distribution ───────────────
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build #${{ github.run_number }} — v1.0.0
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}

      # ── 11. Artefacto del workflow (descarga manual opcional) ────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tekoplay-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 15
