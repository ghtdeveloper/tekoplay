name: Build & Deploy to Firebase App Distribution

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas de la versión (opcional)'
        required: false
        default: ''

jobs:
  build-and-distribute:
    name: Build APK & Distribute
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código fuente ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (requerido por Gradle 8+) ───────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ──────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ── 4. Node.js (para el script de Firestore) ────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 5. Restaurar archivos sensibles desde Secrets ──────────────────────
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Restore firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > lib/firebase_options.dart

      - name: Restore .env
        run: echo "${{ secrets.ENV_FILE }}" | base64 --decode > .env

      # ── 6. Dependencias Flutter ─────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Build APKs por arquitectura (arm64-v8a + armeabi-v7a) ────────────
      # Genera dos APKs separados, mucho más pequeños que el fat APK
      # arm64-v8a  → dispositivos modernos (95%+ de usuarios)
      # armeabi-v7a → dispositivos antiguos de 32-bit
      - name: Build APKs (split by ABI)
        run: |
          flutter build apk \
            --split-per-abi \
            --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.0

      # ── 8. Instalar dependencias Node (una sola vez) ─────────────────────────
      - name: Install Node dependencies
        run: npm install firebase-admin --save
        working-directory: .github/scripts

      # ── 9. Subir APKs a Firebase Storage con firebase-admin ─────────────────
      - name: Upload APKs to Firebase Storage
        id: upload_storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/upload_apks.js

      # ── 10. Actualizar versión en Firestore (activa el update in-app) ────────
      - name: Update version in Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_URL: ${{ steps.upload_storage.outputs.arm64_url }}
          APK_URL_ARM64: ${{ steps.upload_storage.outputs.arm64_url }}
          APK_URL_ARMEABI: ${{ steps.upload_storage.outputs.armeabi_url }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.0+${{ github.run_number }}"
          RELEASE_NOTES: |
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}
        run: node .github/scripts/update_version.js

      # ── 11. Distribuir arm64-v8a via Firebase App Distribution (cubre 95%+) ─
      - name: Upload arm64-v8a to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: |
            Build #${{ github.run_number }} — v1.0.0 [arm64-v8a]
            Dispositivos: todos los modernos (Samsung, Pixel, Xiaomi, etc.)
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}

      # ── 12. Distribuir armeabi-v7a (dispositivos antiguos de 32-bit) ─────────
      - name: Upload armeabi-v7a to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          releaseNotes: |
            Build #${{ github.run_number }} — v1.0.0 [armeabi-v7a]
            Dispositivos: Android antiguos de 32-bit
            ${{ github.event.head_commit.message }}
            ${{ github.event.inputs.release_notes }}

      # ── 13. Artefactos del workflow (descarga manual) ────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tekoplay-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 15
