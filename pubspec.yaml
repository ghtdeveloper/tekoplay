name: tekoplay
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter
  process_run: ^0.12.4
  flutter_stockfish_plugin: ^1.2.0
  cupertino_icons: ^1.0.8
  audioplayers: ^5.2.1
  flutter_chess_board: ^1.0.1
  shared_preferences: ^2.1.1
  package_info_plus: ^4.0.2
  firebase_core: ^3.6.0          # Downgraded to be compatible
  firebase_messaging: ^15.1.3    # Updated to match firebase_core
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.7
  firebase_storage: ^12.4.10
  permission_handler: ^11.3.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.1
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  intl_utils: ^2.6.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/img_perfil_unknown.png
    - assets/images/splash_tekoplay.png
    - assets/images/chess.png
    - assets/images/domino.png
    - assets/images/coin.png
    - assets/audio/background_music.mp3
    - assets/images/icon_lessons.png
    - assets/images/icon_play_online.png
    - assets/images/icon_play_vs_computer.png
    - assets/images/icon_play_vs_friend.png

